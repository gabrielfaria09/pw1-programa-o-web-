<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO INTERATIVO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>FORMULÁRIO INTERATIVO</h1>
    </header>

    <article>
        <form id="form" method="post">
            <div>
                <input type="hidden" name="acao" value="login">
                <label for="fuser">Insira seu username:</label>
                <input type="text" id="fuser" name="fuser">
            </div>
            <div>
                <label for="fpassword">Insira sua senha:</label>
                <input type="password" id="fpassword" name="fpassword">
            </div>
            <div>
                <label>Insira seu papel:</label>
                <select name="tipo" id="tipo">
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                    <option value="Coordenador">Coordenador</option>
                </select>
            </div>
            <!--<div>
                <button type="submit">Submeter</button>
            </div>-->
        </form>

    </article>

            <div>
                <button id="btn_entrar" onclick="login()" type="submit">Entrar</button>
            </div>

    <script src="script.js"></script>

</body>
</html>
