<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO INTERATIVO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>FORMULÁRIO INTERATIVO</h1>
    </header>

    <article>
        <form id="form" method="post">
            <div>
                <label for="fuser">Insira seu username:</label>
                <input type="text" id="fuser" name="fuser">
            </div>
            <div>
                <label for="fpassword">Insira sua senha:</label>
                <input type="password" id="fpassword" name="fpassword">
            </div>
            <div>
                <button type="submit">Submeter</button>
            </div>
        </form>
    </article>

    <script src="script.js"></script>

</body>
</html>
