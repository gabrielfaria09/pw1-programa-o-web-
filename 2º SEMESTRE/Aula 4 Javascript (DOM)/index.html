<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 4 (DOM)</title>
    <style>
      #teste {
        background-color: aquamarine;
        display: flex;
        flex-wrap: nowrap;
        gap: 2rem;
      }

      .teste2 {
        border: 1px solid black;
        background-color: white;
        color: black;
        align-items: center;
        justify-content: center;
        height: fit-content;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <button onclick="addCard()">Clique aqui</button>

    <div id="teste"></div>

    <script>
      // const p_paragrafo = document.createElement('p');

      // p_paragrafo.innerHTML = paragrafo;
      //p_paragrafo.setAttribute('class', 'teste');

      //document.body.append(p_paragrafo);

      function addCard() {
        const paragrafo = prompt("Digite um texto qualquer:");
        const div = document.getElementById("teste");

        const criar = document.createElement("p");

        criar.textContent = paragrafo;
        criar.setAttribute("class", "teste2");

        div.appendChild(criar);
      }
    </script>
  </body>
</html>
